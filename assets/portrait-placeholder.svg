<svg xmlns="http://www.w3.org/2000/svg" width="370" height="440" viewBox="0 0 370 440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="370" height="440" rx="12" fill="url(#pbg)"/>
  <rect x="0.5" y="0.5" width="369" height="439" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
  <line x1="0" y1="30" x2="370" y2="30" stroke="#30363d"/>

  <!-- Window Controls -->
  <circle cx="20" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="15" r="5" fill="#27c93f"/>
  <text x="185" y="19" fill="#7d8590" font-size="11.5" text-anchor="middle">cyril-p-jose@github: ~$ ./init.sh</text>

  <!-- Terminal Content with Staggered Entrance Animations -->
  <g opacity="0" transform="translate(0, 5)">
    <text x="20" y="58" font-size="12" fill="#7d8590">&gt; Initializing developer profile...</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.1s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </g>

  <g opacity="0" transform="translate(0, 5)">
    <text x="20" y="82" font-size="12" fill="#3fb950">[✓] <tspan fill="#c9d1d9">Identity loaded:</tspan> <tspan fill="#ffa657" font-weight="700">Cyril P Jose</tspan></text>
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.2s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </g>

  <g opacity="0" transform="translate(0, 5)">
    <text x="20" y="106" font-size="12" fill="#3fb950">[✓] <tspan fill="#c9d1d9">Domain:</tspan> <tspan fill="#22d3ee">Computer Science &amp; Engineering</tspan></text>
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.3s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </g>

  <g opacity="0" transform="translate(0, 5)">
    <text x="20" y="130" font-size="12" fill="#3fb950">[✓] <tspan fill="#c9d1d9">Campus:</tspan> <tspan fill="#e6edf3">SJCET Palai, Kerala</tspan></text>
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.4s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </g>

  <!-- Code Frame Box -->
  <g opacity="0" transform="translate(0, 5)">
    <rect x="20" y="152" width="330" height="218" rx="8" fill="#0a0e14" stroke="#30363d" stroke-width="1"/>
    
    <text x="32" y="178" font-size="11.5" fill="#58a6ff">// Developer Manifesto</text>
    <text x="32" y="198" font-size="11.5" fill="#ff7b72">public class <tspan fill="#ffa657">CyrilPJose</tspan> {</text>
    <text x="44" y="218" font-size="11.5" fill="#79c0ff">  String[] <tspan fill="#c9d1d9">roles</tspan> = {</text>
    <text x="56" y="238" font-size="11.5" fill="#a5d6ff">    "CSE Student",</text>
    <text x="56" y="258" font-size="11.5" fill="#a5d6ff">    "Software Developer",</text>
    <text x="56" y="278" font-size="11.5" fill="#a5d6ff">    "Aspiring Educator"</text>
    <text x="44" y="298" font-size="11.5" fill="#79c0ff">  };</text>
    <text x="44" y="322" font-size="11.5" fill="#ff7b72">  void <tspan fill="#d2a8ff">buildAndTeach</tspan>() {</text>
    <text x="56" y="342" font-size="11.5" fill="#3fb950">    // Innovate &amp; Empower</text>
    <text x="44" y="358" font-size="11.5" fill="#ff7b72">  }</text>
    <text x="32" y="364" font-size="11.5" fill="#ff7b72">}</text>

    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.5s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </g>

  <!-- Status Bar with Blinking Cursor -->
  <line x1="0" y1="390" x2="370" y2="390" stroke="#30363d"/>
  <text x="20" y="416" fill="#7d8590" font-size="12">cyril-p-jose@github:~$ <tspan fill="#3fb950">whoami</tspan> <tspan fill="#c9d1d9">Cyril</tspan></text>
  <rect x="250" y="404" width="7.5" height="14" fill="#22d3ee">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
