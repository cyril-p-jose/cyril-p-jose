    <text class="ascii-text" x="30" y="417">@@@@@@@@@@@@@@@@..8@@@@@@@@@@@@@@@@@@@@@@@..@@@@@@@@@@@@@@@@</text>
    <text class="ascii-text" x="30" y="431">@@@@@@@@@@@@@@@@@@''.@@@@@@@@@@@@@@@@@@...@@@@@@@@@@@@@@@@@@</text>
    <text class="ascii-text" x="30" y="445">@@@@@@@@@@@@@@@@@@@@@'....m@@@@@@@.....@@@@@@@@@@@@@@@@@@@@@</text>
    <text class="ascii-text" x="30" y="459">@@@@@@@@@@@@@@@@@@@@@@@@@@/'.....|@@@@@@@@@@@@@@@@@@@@@@@@@@</text>
    <text class="ascii-text" x="30" y="473">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</text>
    <text class="ascii-text" x="30" y="487">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</text>
    <text class="ascii-text" x="30" y="501">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</text>
    <text class="ascii-text" x="30" y="515">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</text>
    <text class="ascii-text" x="30" y="529">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</text>
  </g>

  <g class="anim-line-ready">
    <text class="terminal-text prompt-text" x="30" y="563">&gt;</text>
    <text class="terminal-text status-text" x="50" y="563">SYSTEM ONLINE (ASCII RENDER COMPLETED)</text>
    <rect class="cursor" x="350" y="553" width="8" height="12" />
  </g>
</svg>
