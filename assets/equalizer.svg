<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bar {
        fill: #9d00ff;
        transform-origin: bottom;
      }
      .bar:nth-child(even) {
        fill: #00f0ff;
      }
    </style>
  </defs>
  <rect x="0" y="0" width="200" height="60" fill="transparent" />
  
  <!-- Generating several bars -->
  <rect class="bar" x="10" y="10" width="8" height="40">
    <animate attributeName="height" values="10;40;20;50;10" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="y" values="40;10;30;0;40" dur="1.2s" repeatCount="indefinite" />
  </rect>
  <rect class="bar" x="25" y="20" width="8" height="30">
    <animate attributeName="height" values="30;15;45;20;30" dur="0.9s" repeatCount="indefinite" />
    <animate attributeName="y" values="20;35;5;30;20" dur="0.9s" repeatCount="indefinite" />
  </rect>
  <rect class="bar" x="40" y="5" width="8" height="45">
    <animate attributeName="height" values="45;20;40;10;45" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="y" values="5;30;10;40;5" dur="1.5s" repeatCount="indefinite" />
  </rect>
  <rect class="bar" x="55" y="15" width="8" height="35">
    <animate attributeName="height" values="35;50;15;30;35" dur="1.1s" repeatCount="indefinite" />
    <animate attributeName="y" values="15;0;35;20;15" dur="1.1s" repeatCount="indefinite" />
  </rect>
  <rect class="bar" x="70" y="30" width="8" height="20">
    <animate attributeName="height" values="20;40;10;45;20" dur="0.8s" repeatCount="indefinite" />
    <animate attributeName="y" values="30;10;40;5;30" dur="0.8s" repeatCount="indefinite" />
  </rect>
  <rect class="bar" x="85" y="10" width="8" height="40">
    <animate attributeName="height" values="10;40;20;50;10" dur="1.3s" repeatCount="indefinite" />
    <animate attributeName="y" values="40;10;30;0;40" dur="1.3s" repeatCount="indefinite" />
  </rect>
  <rect class="bar" x="100" y="20" width="8" height="30">
    <animate attributeName="height" values="30;15;45;20;30" dur="1.0s" repeatCount="indefinite" />
    <animate attributeName="y" values="20;35;5;30;20" dur="1.0s" repeatCount="indefinite" />
  </rect>
  <rect class="bar" x="115" y="5" width="8" height="45">
    <animate attributeName="height" values="45;20;40;10;45" dur="1.4s" repeatCount="indefinite" />
    <animate attributeName="y" values="5;30;10;40;5" dur="1.4s" repeatCount="indefinite" />
  </rect>
  <rect class="bar" x="130" y="15" width="8" height="35">
    <animate attributeName="height" values="35;50;15;30;35" dur="1.6s" repeatCount="indefinite" />
    <animate attributeName="y" values="15;0;35;20;15" dur="1.6s" repeatCount="indefinite" />
  </rect>
  <rect class="bar" x="145" y="30" width="8" height="20">
    <animate attributeName="height" values="20;40;10;45;20" dur="0.7s" repeatCount="indefinite" />
    <animate attributeName="y" values="30;10;40;5;30" dur="0.7s" repeatCount="indefinite" />
  </rect>
  <rect class="bar" x="160" y="15" width="8" height="35">
    <animate attributeName="height" values="35;50;15;30;35" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="y" values="15;0;35;20;15" dur="1.2s" repeatCount="indefinite" />
  </rect>
  <rect class="bar" x="175" y="30" width="8" height="20">
    <animate attributeName="height" values="20;40;10;45;20" dur="0.9s" repeatCount="indefinite" />
    <animate attributeName="y" values="30;10;40;5;30" dur="0.9s" repeatCount="indefinite" />
  </rect>
</svg>
